services:
  db:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: movies-village-local-only
      MARIADB_ROOT_HOST: "%"
      MARIADB_DATABASE: movies_village
    volumes:
      - movies-village-db:/var/lib/mysql
      - ./schema.sql:/docker-entrypoint-initdb.d/01-movies-village.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: movies_village
      DB_USER: root
      DB_PASSWORD: movies-village-local-only
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./:/var/www/html:ro
      - movies-village-uploads:/var/www/html/uploads
    command: ["bash", "-lc", "mkdir -p /var/www/html/uploads/posters /var/www/html/uploads/movies && chown -R www-data:www-data /var/www/html/uploads && exec apache2-foreground"]

volumes:
  movies-village-db:
  movies-village-uploads:
